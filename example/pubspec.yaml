name: adapty_recipes
description: Flutter recipes demo application for Adapty SDK.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  adapty_flutter:
    path: ..
  cupertino_icons: ^1.0.8
  cupertino_ui: ^1.1.7
  material_ui: ^1.11.1
  shared_preferences: ^2.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
