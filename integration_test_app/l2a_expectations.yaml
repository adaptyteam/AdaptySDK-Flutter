# What each plugin answers the native probe before activation. The defaults hold for every case
# without a row: a golden request of the SDK proper fails as not activated, an answer to an event
# succeeds, a broken payload of a method that decodes its arguments fails as bad params. A row records
# an outcome that differs from the default, for one case or for every case of the method; a UI method
# has no default and needs a row. A sensitivity row says whether the plugin refuses the broken payloads
# of a method (decodes), takes them (insensitive) or answers not activated before it reads them, so a
# refusal does not show (unobservable). A decoding method lists the fields where it takes broken
# payloads and the fields where activation hides the answer. Every default and row has a reason and a
# source in the native code of the ref the contract is fixed to. probed names the natives the rows
# were recorded on. Every row has to match a case of its platform, or the bundle stops; a record of a
# method counts as matched even where records of cases override it.
