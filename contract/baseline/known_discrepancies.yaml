# Known discrepancies between what the SDK sends or reads and the contract, each with the case that
# still shows it: {id, direction, entry, path, keyword, platform, case, reason, decision} or, for a
# batch entry, {id, keyword, items: [{entry, path, platform, case}], reason, decision, source}.
# decision is fix_dart, ask_native or accepted. Entries are added only after triage.
- id: platform-only-fields-sent-everywhere
  direction: request
  keyword: platform_field
  decision: accepted
  reason: The SDK sends fields of one platform on both; the decoder of the other platform does not read them.
  items:
    - {entry: AdaptyUICreateFlowView.Request, path: /enable_safe_area_paddings, platform: ios, case: adapty_ui_create_flow_view/default}
    - {entry: AdaptyUICreateFlowView.Request, path: /enable_safe_area_paddings, platform: ios, case: pseudo/flow_platform_view/default}
    - {entry: AdaptyUICreateFlowView.Request, path: /product_purchase_parameters, platform: ios, case: adapty_ui_create_flow_view/product_purchase_parameters}
    - {entry: AdaptyUICreateFlowView.Request, path: /product_purchase_parameters, platform: ios, case: pseudo/flow_platform_view/product_purchase_parameters}
    - {entry: MakePurchase.Request, path: /parameters, platform: ios, case: make_purchase/with_parameters}
    - {entry: Activate.Request, path: /configuration/customer_identity_parameters/obfuscated_account_id, platform: ios, case: activate/full}
    - {entry: Activate.Request, path: /configuration/customer_identity_parameters/app_account_token, platform: android, case: activate/full}
    - {entry: Identify.Request, path: /parameters/obfuscated_account_id, platform: ios, case: identify/with_parameters}
    - {entry: Identify.Request, path: /parameters/app_account_token, platform: android, case: identify/with_parameters}
  source:
    - 'dart: lib/src/adaptyui.dart:164 and lib/src/platform_views/adaptyui_flow_platform_view.dart:180 (enable_safe_area_paddings, always); lib/src/adaptyui.dart:174, lib/src/platform_views/adaptyui_flow_platform_view.dart:195 (product_purchase_parameters, when given); lib/src/adapty.dart:468 (parameters, when given); lib/src/models/private/adapty_customer_identity_json_builder.dart:5-6, lib/src/adapty.dart:233 (identity, when given); none of them depends on the platform'
    - 'not read by ios@release/4.4.1: Sources.AdaptyPlugin/Requests/Request.AdaptyUICreateFlowView.swift:62-70 (also the creation parameters of the platform view, Sources.AdaptyPlugin/PlatformViewSupport/AdaptyPlugin+NativeViewRequest.swift:24); Sources.AdaptyPlugin/Requests/Request.MakePurchase.swift:16-17; Sources/Profile/Entities/CustomerIdentityParameters.swift:14-20'
    - 'not read by android@4.4.0: crossplatform/src/main/java/com/adapty/internal/crossplatform/CrossplatformConfigTypeAdapterFactory.kt:44-47, crossplatform/src/main/java/com/adapty/internal/crossplatform/IdentifyArgsTypeAdapterFactory.kt:30-31 (app_account_token)'
