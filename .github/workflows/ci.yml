name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

# Stage 1 runs on Linux only (no iOS toolchain), so it can exercise the plugin +
# example only on Flutter where SwiftPM "just works" — i.e. 3.44+, where SwiftPM is
# the default. Our declared floor (Flutter 3.32) can't be validated here: an
# SwiftPM-only plugin needs the consuming project migrated to SwiftPM, and that
# migration requires an iOS build (macOS). The 3.32 boundary therefore moves to
# stage 2 (a macOS job — separate spec). The plugin package alone, without the
# example, does resolve on the floor: analyze-test (min) analyzes and tests it there.
jobs:
  analyze-test-min:
    name: analyze-test (min)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The floor in pubspec.yaml (environment): raise it there and here together.
      FLUTTER_FLOOR: 3.32.0
      DART_FLOOR: 3.8.0
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_FLOOR }}
          channel: stable
          cache: true

      - run: flutter --version

      - name: Check that the floor matches pubspec.yaml
        run: |
          grep -qxF "  flutter: \">=$FLUTTER_FLOOR\"" pubspec.yaml ||
            { echo "::error::FLUTTER_FLOOR $FLUTTER_FLOOR is not the flutter floor in pubspec.yaml"; exit 1; }
          grep -qxF "  sdk: \">=$DART_FLOOR <4.0.0\"" pubspec.yaml ||
            { echo "::error::DART_FLOOR $DART_FLOOR is not the sdk floor in pubspec.yaml"; exit 1; }
          dart --version 2>&1 | grep -qF "Dart SDK version: $DART_FLOOR " ||
            { echo "::error::Flutter $FLUTTER_FLOOR does not ship Dart $DART_FLOOR"; exit 1; }

      # Below Flutter 3.44 the example doesn't resolve on Linux (see above).
      - name: Resolve root package
        run: flutter pub get --no-example

      # Errors and warnings fail the job. Infos don't: the Dart 3.8 analyzer reports
      # the deprecated members that lib/adapty_flutter.dart exports, which later
      # analyzers don't, and analyze-test (stable) keeps infos fatal.
      - name: Analyze root package
        run: flutter analyze --no-fatal-infos lib tool test

      - name: Test root package
        run: flutter test

  analyze-test:
    name: analyze-test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable
            channel: stable   # latest stable (SwiftPM default-on)
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          cache: true

      - run: flutter --version

      - name: Resolve root package
        run: flutter pub get

      - name: Analyze root package
        run: flutter analyze lib tool test

      - name: Check for absolute self-imports
        run: ./tool/check_no_absolute_self_imports.sh

      - name: Test root package
        run: flutter test

      # The runner is in UTC, where a local midnight is the same day in UTC: a birthday sent as the UTC date of
      # a local date would pass. Ahead of UTC it falls on the day before (test/tool/ci_timezone_step_test.dart).
      - name: Test the contract requests in a timezone ahead of UTC
        env:
          TZ: Asia/Dubai
        run: flutter test test/contract/requests_test.dart test/contract/platform_view_params_test.dart

      # The native probe builds the integration test app only when native inputs change; analyze it on every run. Its
      # cases are generated and git-ignored (test/tool/ci_app_analysis_step_test.dart keeps these steps).
      - name: Generate the cases of the integration test app
        run: dart run tool/l2a/bundle_cases.dart --discover

      - name: Resolve the integration test app
        working-directory: integration_test_app
        run: flutter pub get

      - name: Analyze the integration test app
        working-directory: integration_test_app
        run: flutter analyze

      - name: Resolve example package
        working-directory: example
        run: flutter pub get

      - name: Analyze example package
        working-directory: example
        run: flutter analyze

      - name: Test example package
        working-directory: example
        run: flutter test

  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # master carries released versions: compare with the release before the one in pubspec.yaml
      ADAPTY_RELEASE_LINE: ${{ github.ref == 'refs/heads/master' || github.base_ref == 'master' }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.8 # keep in sync with .fvmrc
          cache: true

      - name: Install dart_apitool
        run: dart pub global activate dart_apitool 0.23.2

      - name: Check the public API snapshot
        run: dart run tool/api/check_api.dart

  android-unit:
    name: android-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.8 # keep in sync with .fvmrc
          cache: true

      - name: Generate the Gradle wrapper of the example app
        working-directory: example
        run: flutter pub get && flutter build apk --config-only

      - name: Run the unit tests of the Android plugin
        working-directory: example/android
        run: ./gradlew :adapty_flutter:testDebugUnitTest

      - name: Check that the unit tests ran
        run: |
          files=(example/build/adapty_flutter/test-results/testDebugUnitTest/TEST-*.xml)
          [ -e "${files[0]}" ] || { echo "no unit test results (NO-SOURCE?)"; exit 1; }
          grep -hE '<testsuite [^>]*tests="[1-9]' "${files[@]}" >/dev/null || { echo "no unit tests ran"; exit 1; }
